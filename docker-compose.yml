version: "3.9"
services:

  api-server:
    image: eu.gcr.io/sobolt-plantfellow/flex.pipeline.api-server:${VERSION_TAG}
    container_name: api_server_container
    ports:
      - ${API_SERVER_PORT}:80
    volumes:
      - data:${PIPELINE_OUTPUT_FOLDER}
    env_file:
      - .env
    command: /start-reload.sh

  redis:
    image: redis
    restart: always
    ports:
      - 6379:6379

  pubsub-server:
    image: eu.gcr.io/sobolt-plantfellow/flex.pipeline.pubsub-server:${VERSION_TAG}
    container_name: pubsub_listener_container
    volumes:
      - data:${PIPELINE_OUTPUT_FOLDER}
    env_file:
      - .env
    entrypoint: python -u listener.py

  pubsub-server-publisher:
    image: eu.gcr.io/sobolt-plantfellow/flex.pipeline.pubsub-server:${VERSION_TAG}
    container_name: pubsub_publisher_container
    volumes:
      - data:${PIPELINE_OUTPUT_FOLDER}
    env_file:
      - .env
    entrypoint: python -u publisher.py

  pipeline-manager:
    image: eu.gcr.io/sobolt-plantfellow/flex.pipeline.pipeline-manager:${VERSION_TAG}
    container_name: pipeline_manager_container
    depends_on:
      - redis
    restart: always
    volumes:
      - data:${PIPELINE_OUTPUT_FOLDER}
    env_file:
      - .env
    entrypoint: celery -A worker.app worker --hostname=pipeline-manager-worker@%h -c 200 -Ofair --loglevel=info -Q "pipeline-manager" --uid=nobody --gid=nogroup

  vm-manager:
    image: eu.gcr.io/sobolt-plantfellow/flex.pipeline.vm-manager:${VERSION_TAG}
    container_name: vm_manager_container
    restart: always
    volumes:
      - data:${PIPELINE_OUTPUT_FOLDER}
      - ~/.config/gcloud:/root/config/gcloud
    env_file:
      - .env
    depends_on:
      - redis
    entrypoint: python -u manage_vms.py

  uploading:
    image: eu.gcr.io/sobolt-plantfellow/flex.pipeline.uploading:${VERSION_TAG}
    container_name: uploading_container
    restart: always
    volumes:
      - data:${PIPELINE_OUTPUT_FOLDER}
    env_file:
      - .env
    entrypoint: celery -A worker.app worker --hostname=uploading-worker@%h -c 1 -Ofair --loglevel=info -Q "uploading" --uid=nobody --gid=nogroup


volumes:
  data:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${PIPELINE_OUTPUT_FOLDER}
